name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_heavy:
        description: Run heavy plugin builds for manual dispatch
        required: false
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: EsionHsrahLatigid/juce-ci/.github/workflows/plugin-ci.yml@926c5bb10335c29503f92869169759ec18d71449
    permissions:
      contents: read
    with:
      product_name: LAMEglitch
      product_slug: lameglitch
      cmake_option_prefix: LAMEGLITCH
      debug_targets_json: '["LAMEglitchSmokeTests","LAMEglitchMP3CodecTests","LAMEglitchRealtimeSafetyTests","LAMEglitchWorkerTests"]'
      release_test_targets_json: '["LAMEglitchSmokeTests","LAMEglitchMP3CodecTests","LAMEglitchRealtimeSafetyTests","LAMEglitchWorkerTests"]'
      windows_debug_plugins: true
